[package]
name = "chain-eye"
version = "0.1.0"
edition = "2021"
description = "Real-time EVM transaction monitoring TUI"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# EVM
alloy = { version = "1.5", features = ["provider-ws", "rpc-types"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
chrono = "0.4"
dirs = "6"
